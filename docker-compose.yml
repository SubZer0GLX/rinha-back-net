# Rinha de Backend 2026 — fraud detection (C# / .NET 9)
# nginx round-robin -> 2 API replicas. Total budget: 1 CPU, 350 MB.
#
# Local: build the image first ->  docker build -t fraud-api:local .
# Then:  docker compose up
# For submission, set IMAGE to the public registry tag (image already contains index.bin).

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rinha26-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "28MB"

  api1:
    image: ${IMAGE:-fraud-api:local}
    container_name: rinha26-api1
    environment:
      - NPROBE=12
      - PORT=8080
      - DOTNET_GCHeapHardLimitPercent=80
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "161MB"

  api2:
    image: ${IMAGE:-fraud-api:local}
    container_name: rinha26-api2
    environment:
      - NPROBE=12
      - PORT=8080
      - DOTNET_GCHeapHardLimitPercent=80
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "161MB"

networks:
  app:
    driver: bridge
