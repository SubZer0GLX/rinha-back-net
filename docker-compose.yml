# Rinha de Backend 2026 — submission compose (branch `submission`).
# Pulls the public image (index.bin already baked in). nginx round-robin -> 2 API replicas.
# Budget: 1 CPU, 350 MB total. Network: bridge. Public port: 9999.
#
# Replace GHCR_USER with your GitHub username before pushing the submission branch.

services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "28MB"

  api1:
    image: ghcr.io/subzer0glx/rinha-2026-fraud:latest
    environment:
      - NPROBE=12
      - PORT=8080
      - DOTNET_GCHeapHardLimitPercent=80
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "161MB"

  api2:
    image: ghcr.io/subzer0glx/rinha-2026-fraud:latest
    environment:
      - NPROBE=12
      - PORT=8080
      - DOTNET_GCHeapHardLimitPercent=80
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "161MB"

networks:
  app:
    driver: bridge
