worker_processes 1;
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/null crit;

    # pure round-robin across the two API instances, no business logic
    upstream api {
        server api1:8080 max_fails=0;
        server api2:8080 max_fails=0;
        keepalive 256;
    }

    server {
        listen 9999 default_server;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
